name: Deploy, Tag, and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to verify or republish (without v)"
        required: true
        type: string
      deploy:
        description: "Deploy this tag to Cloudflare before checking npm"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-tag.yml"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - "wrangler.wallet.toml"
      - "scripts/deploy.ts"
      - "scripts/remote-check.ts"
      - "site/**"
      - "wallet/**"
      - "src/nisli-ui/**"
      - "packages/**"
      - "examples/**"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CURRENT_VERSION="${INPUT_VERSION#v}"
          else
            CURRENT_VERSION=$(node -p "require('./packages/cli/package.json').version")
          fi

          if ! echo "$CURRENT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: $CURRENT_VERSION"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && ! git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag v$CURRENT_VERSION does not exist"
            exit 1
          fi

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] && \
               ! git diff --quiet "v$CURRENT_VERSION"...HEAD -- packages/cli packages/daemon packages/protocol; then
              echo "::error::The published CLI changed without a new packages/cli version (current tag: v$CURRENT_VERSION)"
              echo "::error::Bump @gkoreli/agentport before deployment so npm and the hosted relay cannot diverge"
              exit 1
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.prepare.outputs.version) || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      # Official branded Chrome removed --load-extension in 137. Chrome for
      # Testing deliberately retains it for unpacked-extension automation.
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 151.0.7922.76

      - name: Install and verify
        env:
          AGENTPORT_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          # ubuntu-24.04's AppArmor policy disables unprivileged user
          # namespaces, so CfT cannot create its sandbox on this ephemeral
          # runner. The harness otherwise keeps the sandbox everywhere.
          AGENTPORT_CHROME_NO_SANDBOX: "1"
        run: |
          npm ci
          npm run typecheck
          npx tsc -p examples/inkwell/tsconfig.json
          npx tsc -p site/tsconfig.json
          npx tsc -p site/tsconfig.worker.json
          npx tsc -p wallet/tsconfig.json
          npx tsc -p packages/extension/tsconfig.json --noEmit
          npm run wire:check
          npm run webmcp:harvest
          npm run agui:check
          npm run wallet:check
          npm run ui:smoke
          npm run check:extension
          "$AGENTPORT_CHROME" --version
          npm run ui:extension-smoke
          npm run source:check
          npm run docs:check
          npm run e2e
          npm run site:build
          npm run wallet:build

      - name: Build release package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::Release v$VERSION points at package version $PACKAGE_VERSION"
            exit 1
          fi
          npm run build --workspace=@gkoreli/agentport
          BUILT_VERSION=$(node packages/cli/dist/main.js --version)
          if [[ "$BUILT_VERSION" != "$VERSION" ]]; then
            echo "::error::Built CLI reports $BUILT_VERSION, expected $VERSION"
            exit 1
          fi
          test -f packages/cli/dist/remote-check.js
          mkdir release
          npm pack ./packages/cli --pack-destination release

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ needs.prepare.outputs.version }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  tag:
    needs: [prepare, verify]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: v${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  deploy:
    needs: [prepare, verify, tag]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.verify.result == 'success' &&
        (needs.tag.result == 'success' || needs.tag.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.prepare.outputs.version) || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install deployment dependencies
        run: npm ci

      - name: Deploy matching Worker, relay, and wallet
        # A matching protected-environment marker certifies that this exact
        # commit was already deployed manually. Every other push must deploy
        # here; missing CI credentials therefore fail closed before npm.
        if: >-
          ${{
            (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOYED_COMMIT != github.sha) ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy)
          }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:ci

      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ needs.prepare.outputs.version }}
          path: release

      - name: Prove the deployed relay matches the exact npm artifact
        run: |
          SMOKE_ROOT=$(mktemp -d)
          tar -xzf release/*.tgz -C "$SMOKE_ROOT"
          test -f "$SMOKE_ROOT/package/dist/remote-check.js"
          for attempt in 1 2 3; do
            if timeout 90s node "$SMOKE_ROOT/package/dist/remote-check.js"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "The Durable Object may still be draining the previous version; retrying in 10 seconds"
              sleep 10
            fi
          done
          echo "::error::Deployed relay did not pass the remote check after three bounded attempts"
          exit 1

  npm:
    needs: [prepare, verify, tag, deploy]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.verify.result == 'success' &&
        (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
        needs.deploy.result == 'success' &&
        (needs.prepare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ needs.prepare.outputs.version }}
          path: release

      - name: Publish npm package if absent
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if npm view "@gkoreli/agentport@$VERSION" version >/dev/null 2>&1; then
            echo "@gkoreli/agentport@$VERSION is already published"
            exit 0
          fi
          npm publish release/*.tgz --provenance --access public
